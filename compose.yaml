services:
  obs:
    image: ghcr.io/kgregor98/kasm-obs:latest
    container_name: kasm-obs
    restart: unless-stopped
    shm_size: "2gb"
    # Time for OBS to save and finish recordings on "docker compose down"/"stop"
    stop_grace_period: 30s
    ports:
      - "6901:6901"
    volumes:
      - obs-config:/mnt/obs-config
      - obs-media:/media:ro
      - obs-recordings:/recordings
    # Values come from the shell, a .env file next to this file, or Portainer stack variables.
    # Unset variables become empty, which the image treats as "off".
    # In .env, a "$" in a value (e.g. a password) must be written as "$$" or the value single-quoted.
    # Examples:
    #   SSL_ENABLED=true
    #   HTTP_USER=obs
    #   HTTP_PASSWORD=change-me
    #   OBS_ARGS=--startstreaming --profile "Live" --scene "Starting Soon"
    #   TZ=Europe/Warsaw
    environment:
      SSL_ENABLED: ${SSL_ENABLED:-}
      HTTP_USER: ${HTTP_USER:-}
      HTTP_PASSWORD: ${HTTP_PASSWORD:-}
      OBS_ARGS: ${OBS_ARGS:-}
      OBS_STOP_TIMEOUT: ${OBS_STOP_TIMEOUT:-}
      TZ: ${TZ:-Etc/UTC}
    # NVIDIA hardware encoding (needs the NVIDIA Container Toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  obs-config:
  obs-media:
  obs-recordings:
